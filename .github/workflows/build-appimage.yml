name: Linux AppImages

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        config:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.config.os }}
    name: Build ${{ matrix.config.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up dependencies from source
        run: |
          # Install build dependencies
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl wget git pkg-config python3-pip libudev-dev autoconf automake libtool
          
          # Upgrade Meson to a compatible version
          pip3 install --upgrade meson

      - name: Install dependencies from source
        run: |
          # Install zlib
          curl -LO https://zlib.net/current/zlib.tar.gz
          tar -xzvf zlib.tar.gz
          cd zlib-*
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

          # Install SDL2
          curl -LO https://github.com/libsdl-org/SDL/releases/download/release-2.32.2/SDL2-2.32.2.tar.gz
          tar -xzvf SDL2-2.32.2.tar.gz
          cd SDL2-2.32.2
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

          # Install SDL2_mixer
          curl -LO https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-2.8.1.tar.gz
          tar -xzvf SDL2_mixer-2.8.1.tar.gz
          cd SDL2_mixer-2.8.1
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

          # Install SDL2_image
          curl -LO https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.8/SDL2_image-2.8.8.tar.gz
          tar -xzvf SDL2_image-2.8.8.tar.gz
          cd SDL2_image-2.8.8
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

          # Install SDL2_ttf
          curl -LO https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz
          tar -xzvf SDL2_ttf-2.24.0.tar.gz
          cd SDL2_ttf-2.24.0
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

          # Install GStreamer
          curl -LO https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-1.26.0.tar.xz
          tar -xvf gstreamer-1.26.0.tar.xz
          cd gstreamer-1.26.0
          meson setup builddir --prefix=$HOME/deps --buildtype=release
          ninja -C builddir
          ninja -C builddir install
          cd ..

          # Install libusb
          curl -LO https://github.com/libusb/libusb/releases/download/v1.0.24/libusb-1.0.24.tar.bz2
          tar -xvf libusb-1.0.24.tar.bz2
          cd libusb-1.0.24
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

          # Install libevdev
          curl -LO https://www.freedesktop.org/software/libevdev/libevdev-1.13.4.tar.xz
          tar -xvf libevdev-1.13.4.tar.xz
          cd libevdev-1.13.4
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

          # Install libminizip
          curl -LO https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.0.9.tar.gz
          tar -xvf 4.0.9.tar.gz
          cd minizip-ng-4.0.9
          cmake -S . -D MZ_BUILD_TESTS=ON
          make -j$(nproc)
          make install
          cd ..

          # Install libglib
          curl -LO https://download.gnome.org/sources/glib/2.84/glib-2.84.1.tar.xz
          tar -xvf glib-2.84.1.tar.xz
          cd glib-2.84.1
          # Setup environment
          mkdir build
          meson setup build --prefix=$HOME/deps
          meson compile -C build
          meson install -C build
          cd ..

          # Install sqlite3
          curl -LO https://sqlite.org/2023/sqlite-autoconf-3410200.tar.gz
          tar -xvf sqlite-autoconf-3410200.tar.gz
          cd sqlite-autoconf-3410200
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

          # Install libwebp
          curl -LO https://github.com/webmproject/libwebp/archive/refs/tags/v1.5.0.tar.gz
          tar -xvf v1.5.0.tar.gz
          cd libwebp-1.5.0
          ./autogen.sh
          ./configure --prefix=$HOME/deps
          make -j$(nproc)
          make install
          cd ..

      - name: Configure CMake
        env:
          PKG_CONFIG_PATH: $HOME/deps/lib/pkgconfig
          LD_LIBRARY_PATH: $HOME/deps/lib
          CMAKE_PREFIX_PATH: $HOME/deps
          C_INCLUDE_PATH: $HOME/deps/include
          CPLUS_INCLUDE_PATH: $HOME/deps/include
        run: |
          cmake RetroFE/Source -BRetroFE/Build \
            -DCMAKE_PREFIX_PATH=$HOME/deps \
            -DCMAKE_LIBRARY_PATH=$HOME/deps/lib \
            -DCMAKE_INCLUDE_PATH=$HOME/deps/include \
            -DCMAKE_INSTALL_RPATH=$HOME/deps/lib \
            -DCMAKE_BUILD_RPATH=$HOME/deps/lib \
            -DCMAKE_SKIP_RPATH=OFF


      - name: Build
        run: cmake --build RetroFE/Build

      - name: Install linuxdeploy
        run: |
          if [ "${{ matrix.config.arch }}" == "arm64" ]; then
            wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage -O linuxdeploy-arm64.AppImage
            chmod +x linuxdeploy-arm64.AppImage
          else
            wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.config.arch }}.AppImage
            chmod +x linuxdeploy-${{ matrix.config.arch }}.AppImage
          fi

      - name: Install linuxdeploy-plugin-gstreamer
        run: |
          wget https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/refs/heads/master/linuxdeploy-plugin-gstreamer.sh
          chmod +x linuxdeploy-plugin-gstreamer.sh

      - name: Package AppImage
        run: |
          ./linuxdeploy-${{ matrix.config.arch }}.AppImage \
            --executable RetroFE/Build/retrofe \
            --appdir RetroFE/Build/AppDir \
            --plugin gstreamer \
            --output appimage \
            --desktop-file Package/Environment/Linux/retrofe.desktop \
            --icon-file Package/Environment/Common/RetroFE.png
          if [ "${{ matrix.config.arch }}" == "arm64" ]; then
            mv RetroFE-aarch64.AppImage RetroFE-arm64.AppImage
          fi
          
      - name: Upload ${{ matrix.config.arch }} AppImage
        uses: actions/upload-artifact@v4
        with:
          name: RetroFE-${{ matrix.config.arch }}.AppImage
          path: RetroFE-${{ matrix.config.arch }}.AppImage
