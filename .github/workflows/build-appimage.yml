name: Linux AppImages

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        config:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.config.os }}
    name: Build ${{ matrix.config.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up dependencies from source
        run: |
          # Install build dependencies
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl wget git pkg-config python3-pip libudev-dev autoconf automake libtool ninja-build bison flex libglib2.0-dev zlib1g-dev libglib2.0-0 zlib1g meson
          
          # Upgrade Meson to a compatible version
          pip install --upgrade meson
          pip3 install --upgrade meson

      - name: Clone and Build GStreamer
        run: |
          # Clone the GStreamer mono repository
          git clone https://gitlab.freedesktop.org/gstreamer/gstreamer.git --branch 1.26.0
          cd gstreamer

          # Configure Meson to build only the required components
          meson setup builddir \
              -Dtests=disabled \
              -Dexamples=disabled \
              -Dbad=disabled \
              -Dugly=disabled

          # Compile and install
          meson compile -C builddir
          sudo meson install -C builddir
          cd ..

      - name: Verify Installation
        run: |
          gst-launch-1.0 --version
          gst-inspect-1.0

      - name: Cache SDL2
        uses: actions/cache@v3
        with:
          path: $HOME/deps/SDL2
          key: sdl2-${{ runner.os }}-${{ hashFiles('SDL2-2.32.2.tar.gz') }}
          restore-keys: |
            sdl2-${{ runner.os }}-

      - name: Install SDL2
        run: |
          if [ ! -d "$HOME/deps/SDL2" ]; then
            curl -LO https://github.com/libsdl-org/SDL/releases/download/release-2.32.2/SDL2-2.32.2.tar.gz
            tar -xzvf SDL2-2.32.2.tar.gz
            cd SDL2-2.32.2
            ./configure --prefix=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Cache SDL2_mixer
        uses: actions/cache@v3
        with:
          path: $HOME/deps/SDL2_mixer
          key: sdl2_mixer-${{ runner.os }}-${{ hashFiles('SDL2_mixer-2.8.1.tar.gz') }}
          restore-keys: |
            sdl2_mixer-${{ runner.os }}-

      - name: Install SDL2_mixer
        run: |
          if [ ! -d "$HOME/deps/SDL2_mixer" ]; then
            curl -LO https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-2.8.1.tar.gz
            tar -xzvf SDL2_mixer-2.8.1.tar.gz
            cd SDL2_mixer-2.8.1
            ./configure --prefix=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Cache SDL2_image
        uses: actions/cache@v3
        with:
          path: $HOME/deps/SDL2_image
          key: sdl2_image-${{ runner.os }}-${{ hashFiles('SDL2_image-2.8.8.tar.gz') }}
          restore-keys: |
            sdl2_image-${{ runner.os }}-

      - name: Install SDL2_image
        run: |
          if [ ! -d "$HOME/deps/SDL2_image" ]; then
            curl -LO https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.8/SDL2_image-2.8.8.tar.gz
            tar -xzvf SDL2_image-2.8.8.tar.gz
            cd SDL2_image-2.8.8
            ./configure --prefix=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Cache SDL2_ttf
        uses: actions/cache@v3
        with:
          path: $HOME/deps/SDL2_ttf
          key: sdl2_ttf-${{ runner.os }}-${{ hashFiles('SDL2_ttf-2.24.0.tar.gz') }}
          restore-keys: |
            sdl2_ttf-${{ runner.os }}-

      - name: Install SDL2_ttf
        run: |
          if [ ! -d "$HOME/deps/SDL2_ttf" ]; then
            curl -LO https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz
            tar -xzvf SDL2_ttf-2.24.0.tar.gz
            cd SDL2_ttf-2.24.0
            ./configure --prefix=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Cache libusb
        uses: actions/cache@v3
        with:
          path: $HOME/deps/libusb
          key: libusb-${{ runner.os }}-${{ hashFiles('libusb-1.0.24.tar.bz2') }}
          restore-keys: |
            libusb-${{ runner.os }}-

      - name: Install libusb
        run: |
          if [ ! -d "$HOME/deps/libusb" ]; then
            curl -LO https://github.com/libusb/libusb/releases/download/v1.0.24/libusb-1.0.24.tar.bz2
            tar -xvf libusb-1.0.24.tar.bz2
            cd libusb-1.0.24
            ./configure --prefix=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Cache libevdev
        uses: actions/cache@v3
        with:
          path: $HOME/deps/libevdev
          key: libevdev-${{ runner.os }}-${{ hashFiles('libevdev-1.13.4.tar.xz') }}
          restore-keys: |
            libevdev-${{ runner.os }}-

      - name: Install libevdev
        run: |
          if [ ! -d "$HOME/deps/libevdev" ]; then
            curl -LO https://www.freedesktop.org/software/libevdev/libevdev-1.13.4.tar.xz
            tar -xvf libevdev-1.13.4.tar.xz
            cd libevdev-1.13.4
            ./configure --prefix=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Cache libminizip
        uses: actions/cache@v3
        with:
          path: $HOME/deps/minizip-ng
          key: minizip-ng-${{ runner.os }}-${{ hashFiles('4.0.9.tar.gz') }}
          restore-keys: |
            minizip-ng-${{ runner.os }}-

      - name: Install libminizip
        run: |
          if [ ! -d "$HOME/deps/minizip-ng" ]; then
            curl -LO https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.0.9.tar.gz
            tar -xvf 4.0.9.tar.gz
            cd minizip-ng-4.0.9
            cmake -S . -D MZ_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Cache sqlite3
        uses: actions/cache@v3
        with:
          path: $HOME/deps/sqlite3
          key: sqlite3-${{ runner.os }}-${{ hashFiles('sqlite-autoconf-3410200.tar.gz') }}
          restore-keys: |
            sqlite3-${{ runner.os }}-

      - name: Install sqlite3
        run: |
          if [ ! -d "$HOME/deps/sqlite3" ]; then
            curl -LO https://sqlite.org/2023/sqlite-autoconf-3410200.tar.gz
            tar -xvf sqlite-autoconf-3410200.tar.gz
            cd sqlite-autoconf-3410200
            ./configure --prefix=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Cache libwebp
        uses: actions/cache@v3
        with:
          path: $HOME/deps/libwebp
          key: libwebp-${{ runner.os }}-${{ hashFiles('libwebp-1.5.0.tar.gz') }}
          restore-keys: |
            libwebp-${{ runner.os }}-

      - name: Install libwebp
        run: |
          if [ ! -d "$HOME/deps/libwebp" ]; then
            curl -LO https://github.com/webmproject/libwebp/archive/refs/tags/v1.5.0.tar.gz
            tar -xvf v1.5.0.tar.gz
            cd libwebp-1.5.0
            ./autogen.sh
            ./configure --prefix=$HOME/deps
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Configure CMake
        env:
          PKG_CONFIG_PATH: $HOME/deps/lib/pkgconfig
          LD_LIBRARY_PATH: $HOME/deps/lib
          CMAKE_PREFIX_PATH: $HOME/deps
          C_INCLUDE_PATH: $HOME/deps/include
          CPLUS_INCLUDE_PATH: $HOME/deps/include
        run: |
          cmake RetroFE/Source -BRetroFE/Build \
            -DCMAKE_PREFIX_PATH=$HOME/deps \
            -DCMAKE_LIBRARY_PATH=$HOME/deps/lib \
            -DCMAKE_INCLUDE_PATH=$HOME/deps/include \
            -DCMAKE_INSTALL_RPATH=$HOME/deps/lib \
            -DCMAKE_BUILD_RPATH=$HOME/deps/lib \
            -DCMAKE_SKIP_RPATH=OFF

      - name: Build
        run: cmake --build RetroFE/Build

      - name: Install linuxdeploy
        run: |
          if [ "${{ matrix.config.arch }}" == "arm64" ]; then
            wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage -O linuxdeploy-arm64.AppImage
            chmod +x linuxdeploy-arm64.AppImage
          else
            wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.config.arch }}.AppImage
            chmod +x linuxdeploy-${{ matrix.config.arch }}.AppImage
          fi

      - name: Install linuxdeploy-plugin-gstreamer
        run: |
          wget https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/refs/heads/master/linuxdeploy-plugin-gstreamer.sh
          chmod +x linuxdeploy-plugin-gstreamer.sh

      - name: Package AppImage
        run: |
          ./linuxdeploy-${{ matrix.config.arch }}.AppImage \
            --executable RetroFE/Build/retrofe \
            --appdir RetroFE/Build/AppDir \
            --plugin gstreamer \
            --output appimage \
            --desktop-file Package/Environment/Linux/retrofe.desktop \
            --icon-file Package/Environment/Common/RetroFE.png
          if [ "${{ matrix.config.arch }}" == "arm64" ]; then
            mv RetroFE-aarch64.AppImage RetroFE-arm64.AppImage
          fi

      - name: Upload ${{ matrix.config.arch }} AppImage
        uses: actions/upload-artifact@v4
        with:
          name: RetroFE-${{ matrix.config.arch }}.AppImage
          path: RetroFE-${{ matrix.config.arch }}.AppImage
